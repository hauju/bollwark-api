[package]
name = "bollwark"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The server stays the root package, so `cargo build`, the Dockerfile and CI
# are unchanged. `crates/` holds integration libraries published for consumers
# of this service; they are not linked into the server binary, so its property
# of making zero outbound HTTP calls survives their dependencies.
[workspace]
members = ["crates/bollwark-verify"]

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "fs",
    "timeout",
    "set-header",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
argon2 = "0.5"
hex = "0.4"
rand = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
ipnet = "2"
hmac = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
maxminddb = "0.28"
dotenvy = "0.15"
arc-swap = "1"
notify-debouncer-full = "0.7"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
