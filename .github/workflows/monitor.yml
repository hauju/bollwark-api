name: Monitor public endpoints

# External TLS + uptime monitor. Runs from OUTSIDE the deployment so it sees
# what a browser sees through Coolify's Traefik, which the in-container
# `/healthz` probe cannot: when ACME issuance fails, Traefik quietly falls back
# to its default self-signed cert and every embed on every customer site breaks
# while the app still reports healthy.
#
# A failed run emails the repository owner. Set the MONITOR_WEBHOOK secret for
# a Slack/Discord alert as well.
#
# Targets come from the MONITOR_TARGETS repository variable so hosts can be
# added and retired without a commit — which matters during the
# captcha.oxidt.com → api.bollwark.eu migration, when the set changes twice.
# It is a single-line JSON array of {url, paths}:
#
#   [
#     {"url":"https://api.bollwark.eu","paths":"/healthz /v1/widget.js /static/captcha-widget.js /static/captcha-widget.css"},
#     {"url":"https://bollwark.eu","paths":"/"},
#     {"url":"https://captcha.oxidt.com","paths":"/healthz /static/captcha-widget.js /static/captcha-widget.css"}
#   ]
#
# Two things that are easy to get wrong:
#   - The legacy instance predates `/v1/widget.js`. Monitoring it with the new
#     path set would report a permanent false failure.
#   - The marketing apex serves no `/healthz`, so it is monitored as just `/`.
#
# The default below is the pre-migration state, so this workflow is correct
# from the moment it merges and does not alarm on hosts that are not up yet.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          CONFIGURED: ${{ vars.MONITOR_TARGETS }}
        run: |
          default='[{"url":"https://captcha.oxidt.com","paths":"/healthz /static/captcha-widget.js /static/captcha-widget.css"}]'
          echo "matrix=${CONFIGURED:-$default}" >> "$GITHUB_OUTPUT"

  check:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      # One broken host must not hide the state of the others — during the
      # migration they fail independently and for different reasons.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    name: ${{ matrix.target.url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check TLS + assets
        env:
          MONITOR_PATHS: ${{ matrix.target.paths }}
          MONITOR_WEBHOOK: ${{ secrets.MONITOR_WEBHOOK }}
        run: scripts/check-public-endpoint.sh "${{ matrix.target.url }}"
